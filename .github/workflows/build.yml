name: Build WebView APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create and Build APK
        run: |
          cordova create myapp com.abood.chat AboodChat
          cd myapp
          cordova platform add android
          rm -rf www/*
          for item in ../*; do
            name=$(basename "$item")
            if [ "$name" != "myapp" ] && [ "$name" != ".git" ] && [ "$name" != ".github" ]; then
              cp -r "$item" www/
            fi
          done
          cordova build android --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: myapp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
