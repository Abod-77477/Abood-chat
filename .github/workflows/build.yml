name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build WebView APK Wrapper
        uses: KeisukeYamashita/android-webview-actions@v1
        with:
          url: 'https://github.com' # سيتم استبداله لاحقاً بالاستضافة أو تضمين الملفات محلياً

